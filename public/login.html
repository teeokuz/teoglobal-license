<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeoGlobal — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card bg-secondary border-0 shadow" style="max-width: 400px; width: 100%;">
      <div class="card-body p-5 text-center">
        <div class="mb-4">
          <h2 class="fw-bold text-brand">TeoGlobal</h2>
          <p class="text-muted small">Painel de Licenças</p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="password" class="form-label text-start w-100">Senha</label>
            <input type="password" id="password" class="form-control bg-dark border-secondary text-light"
                   placeholder="Digite a senha do painel" required autofocus>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none"></div>
          <button type="submit" class="btn btn-brand w-100" id="loginBtn">
            Entrar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      err.classList.add('d-none');

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        if (r.ok) {
          window.location.href = '/admin/dashboard.html';
        } else {
          const data = await r.json();
          err.textContent = data.error || 'Senha incorreta';
          err.classList.remove('d-none');
        }
      } catch (ex) {
        err.textContent = 'Erro de conexão. Tente novamente.';
        err.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
